<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm Email | Jubilee House International</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body class="account-page"><main class="account-main"><section class="account-intro"><div><p class="eyebrow">ONE LAST STEP</p><h1>Confirm your<br><em>email.</em></h1><p>Enter the six-digit code sent to your email address to activate your Jubilee House account.</p></div></section><section class="account-panel"><div class="account-card"><p class="eyebrow">EMAIL CONFIRMATION</p><h2>Check your inbox</h2><p class="account-muted">Confirmation code for <strong id="emailLabel"></strong></p><form id="confirmForm"><label>Confirmation code<input id="confirmCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></label><button class="button button-gold account-submit" type="submit">Confirm email <i class="fas fa-check"></i></button><p class="account-status" id="confirmStatus" role="status"></p></form><a class="account-help-link" href="account.html">Back to account</a></div></section></main><script>const params=new URLSearchParams(location.search),email=params.get('email')||'';document.getElementById('emailLabel').textContent=email;const form=document.getElementById('confirmForm');form.querySelector('input').value=params.get('code')||'';form.addEventListener('submit',async(event)=>{event.preventDefault();const status=document.getElementById('confirmStatus');try{const response=await fetch('/api/confirm-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code:form.querySelector('input').value})});const result=await response.json();if(!response.ok)throw new Error(result.error);status.textContent=result.message;status.className='account-status success';}catch(error){status.textContent=error.message||'Confirmation failed.';status.className='account-status error';}});</script></body></html>
