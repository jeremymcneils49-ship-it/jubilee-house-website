<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | Jubilee House International</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body class="account-page"><main class="account-main"><section class="account-intro"><div><p class="eyebrow">WELCOME BACK</p><h1>Find your way<br><em>back in.</em></h1><p>Request a secure code to create a new password for your Jubilee House account.</p></div></section><section class="account-panel"><div class="account-card"><p class="eyebrow">PASSWORD RECOVERY</p><h2>Reset your password</h2><form id="resetForm"><label>Email address<input id="resetEmail" type="email" required></label><div id="codeFields" hidden><label>Reset code<input id="resetCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"></label><label>New password<input id="newPassword" type="password" minlength="6"></label></div><button class="button button-gold account-submit" type="submit" id="resetButton">Send reset code <i class="fas fa-arrow-right"></i></button><p class="account-status" id="resetStatus" role="status"></p></form><a class="account-help-link" href="account.html">Back to account</a></div></section></main><script>const form=document.getElementById('resetForm'),status=document.getElementById('resetStatus'),codeFields=document.getElementById('codeFields'),button=document.getElementById('resetButton');let codeSent=false;form.addEventListener('submit',async(event)=>{event.preventDefault();const email=document.getElementById('resetEmail').value.trim().toLowerCase();const payload=codeSent?{email,code:document.getElementById('resetCode').value,password:document.getElementById('newPassword').value}:{email};const endpoint=codeSent?'/api/reset-password':'/api/request-reset';try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw new Error(result.error);if(!codeSent){codeSent=true;codeFields.hidden=false;document.getElementById('resetCode').required=true;document.getElementById('newPassword').required=true;button.innerHTML='Reset password <i class="fas fa-check"></i>';status.textContent=result.development_code?`Code sent. Local development code: ${result.development_code}`:result.message;}else{status.textContent=result.message;button.disabled=true;}status.className='account-status success';}catch(error){status.textContent=error.message||'Password reset failed.';status.className='account-status error';}});</script></body></html>
